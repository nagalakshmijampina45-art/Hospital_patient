{% extends "base.html" %}
{% block content %}
<h2>Patients</h2>
<a class="button" href="/patients/new">Add Patient</a>
<table>
<tr><th>ID</th><th>Name</th><th>Age</th><th>Gender</th><th>Contact</th><th>Action</th></tr>
{% for patient in patients %}
<tr>
<td>{{ patient.id }}</td>
<td>{{ patient.name }}</td>
<td>{{ patient.age }}</td>
<td>{{ patient.gender }}</td>
<td>{{ patient.contact }}</td>
<td>
<a href="/patients/{{ patient.id }}">View</a>
<a href="/patients/{{ patient.id }}/edit">Edit</a>
<form action="/patients/{{ patient.id }}" method="POST" class="inline"
      onsubmit="return confirm('Delete this patient?')">
<input type="hidden" name="_method" value="DELETE">
<button type="submit">Delete</button>
</form>
</td>
</tr>
{% endfor %}
</table>
{% endblock %}
