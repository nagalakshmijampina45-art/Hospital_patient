{% extends "base.html" %}
{% block content %}
<h2>{{ "Edit Patient" if patient else "Add Patient" }}</h2>
<form method="POST">
    <label>Name</label>
    <input name="name" value="{{ patient.name if patient else '' }}" required>

    <label>Age</label>
    <input type="number" name="age" value="{{ patient.age if patient else '' }}" required>

    <label>Gender</label>
    <select name="gender" required>
        <option value="Male" {% if patient and patient.gender == "Male" %}selected{% endif %}>Male</option>
        <option value="Female" {% if patient and patient.gender == "Female" %}selected{% endif %}>Female</option>
        <option value="Other" {% if patient and patient.gender == "Other" %}selected{% endif %}>Other</option>
    </select>

    <label>Contact</label>
    <input name="contact" value="{{ patient.contact if patient else '' }}" required>

    <button type="submit">Save</button>
</form>
{% endblock %}
