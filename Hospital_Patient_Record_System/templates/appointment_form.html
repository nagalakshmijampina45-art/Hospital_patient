{% extends "base.html" %}
{% block content %}
<h2>{{ "Edit Appointment" if appointment else "Schedule Appointment" }}</h2>
<form method="POST">
    <label>Patient</label>
    <select name="patient_id" required>
    {% for patient in patients %}
        <option value="{{ patient.id }}"
        {% if appointment and appointment.patient_id == patient.id %}selected{% endif %}>
            {{ patient.name }}
        </option>
    {% endfor %}
    </select>

    <label>Doctor</label>
    <select name="doctor_id" required>
    {% for doctor in doctors %}
        <option value="{{ doctor.id }}"
        {% if appointment and appointment.doctor_id == doctor.id %}selected{% endif %}>
            {{ doctor.name }} - {{ doctor.specialization }}
        </option>
    {% endfor %}
    </select>

    <label>Date</label>
    <input type="date" name="date"
           value="{{ appointment.date if appointment else '' }}" required>

    <label>Diagnosis</label>
    <input name="diagnosis"
           value="{{ appointment.diagnosis if appointment else '' }}" required>

    <label>Status</label>
    <select name="status" required>
        {% for status in ["Recovered", "Under Treatment", "Critical"] %}
        <option value="{{ status }}"
        {% if appointment and appointment.status == status %}selected{% endif %}>
            {{ status }}
        </option>
        {% endfor %}
    </select>

    <button type="submit">Save</button>
</form>
{% endblock %}
